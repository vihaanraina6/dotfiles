# Currently uses only the terminal's own ANSI colours (no palette, no hex)

"$schema" = "https://starship.rs/config-schema.json"
scan_timeout = 100
command_timeout = 500
follow_symlinks = false
add_newline = true

format = """
$directory\
$git_branch\
$git_status\
$fill\
$python\
$nodejs\
$rust\
$golang\
$lua\
$haskell\
$ruby\
$package\
$aws\
$docker_context\
$jobs\
$cmd_duration\
$line_break\
$character"""

[directory]
style = 'blue'
format = '[$path ]($style)'
truncation_length = 3
truncation_symbol = '…/'
truncate_to_repo = false

[directory.substitutions]
'Documents' = '󰈙'
'Downloads' = ' '
'Music' = ' '
'Pictures' = ' '

[git_branch]
style = 'fg:green'
format = '[on](bright-black) [$symbol$branch ]($style)'

[git_status]
format = '([$all_status$ahead_behind]($style) )'
[fill]
symbol = ' '

[python]
style = 'cyan'
symbol = ' '
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
pyenv_version_name = true
pyenv_prefix = ''

[lua]
symbol = ' '

[nodejs]
style = 'green'
symbol = ' '

[golang]
style = 'bright-blue'
symbol = ' '

[haskell]
style = 'purple'
symbol = ' '

[rust]
style = 'bright-red'
symbol = ' '

[ruby]
style = 'red'
symbol = ' '

[package]
style = 'yellow'
symbol = '󰏗 '

[aws]
symbol = ' '
style = 'yellow'
format = '[$symbol($profile )(\[$duration\] )]($style)'

[docker_context]
symbol = ' '
style = 'cyan'
format = '[$symbol]($style) $path'
detect_files = ['docker-compose.yml', 'docker-compose.yaml', 'Dockerfile']
detect_extensions = ['Dockerfile']

[jobs]
symbol = ' '
style = 'red'
number_threshold = 1
format = '[$symbol]($style)'

[cmd_duration]
min_time = 500
style = 'bright-black'
format = '[$duration]($style)'
